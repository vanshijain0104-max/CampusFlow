services:
  postgres:
    image: postgres:16-alpine
    container_name: campusflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: campusflow
    ports:
      - "5432:5432"
    volumes:
      - campusflow_pgdata:/var/lib/postgresql/data

volumes:
  campusflow_pgdata:
